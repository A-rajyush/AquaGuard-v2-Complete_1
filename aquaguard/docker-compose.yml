version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aquaguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aquaguard
      POSTGRES_USER:     aquaguard
      POSTGRES_PASSWORD: aquaguard_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aquaguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aquaguard]

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aquaguard-backend
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      NODE_ENV:     production
      PORT:         5000
      FRONTEND_URL: http://localhost
      DATABASE_URL: postgresql://aquaguard:aquaguard_pass@postgres:5432/aquaguard
      JWT_SECRET:   change-me-in-production-use-long-random-string
      JWT_EXPIRES:  7d
    volumes: ["./backend/logs:/app/logs"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:5000/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
    networks: [aquaguard]

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: aquaguard-frontend
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [aquaguard]

volumes:
  pgdata:

networks:
  aquaguard:
    driver: bridge
